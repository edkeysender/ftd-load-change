# Forgejo on the Raspberry Pi. Headless install (no web wizard): the env vars
# below pre-configure it so it comes up already installed.
#
# OPTIONAL: deploy/forgejo-setup.sh uses a plain `docker run` (no compose needed),
# so this file is only for those who prefer compose. Run with:
#   PI_HOST=70.84.68.196 FORGEJO_DATA=/var/lib/forgejo docker compose up -d
# Put FORGEJO_DATA on an external SSD for real use, not the SD card.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:7
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - ${FORGEJO_DATA:-/var/lib/forgejo}:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Headless install: sqlite DB + locked installer so no setup wizard.
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__server__DOMAIN=${PI_HOST:-localhost}
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__ROOT_URL=http://${PI_HOST:-localhost}:3000/
      - FORGEJO__server__SSH_PORT=2222
